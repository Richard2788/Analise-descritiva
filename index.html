<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos de Cotas por Curso</title>
      

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js (UMD global) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="./src/style.css">


</head>
<body>
    <div class="container-fluid px-3 px-md-4">
        <header class="page-header">
            <h1>Análise de Cotas por Curso</h1>
            <p class="text-muted-mb-0">Evolução anual de notas mínimas, concorrência, candidatos e vagas</p>
        </header>

        <main id="charts-root"></main>

        <footer>
            Dados processados de database.js · Gráficos gerados com Chart.js · UI com Bootstrap 5
        </footer>
    </div>

    <!-- Modal reutilizável -->
    <div class="modal fade" id="chartModal" tabindex="-1" aria-labelledby="chartModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="chartModalLabel">Curso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <p class="text-muted small mb-2 text-center">Selecione o tipo de gráfico:</p>
                        <div id="metricSelector" role="group" aria-label="Tipos de gráfico">
                            <!-- botões via JS -->
                        </div>
                    </div>

                    <div id="modalChartContainer" class="mb-4 border rounded p-2 bg-white">
                        <canvas id="modalChartCanvas"></canvas>
                    </div>

                    <div>
                        <h6 class="fw-semibold mb-2">Análise do curso</h6>
                        <div id="modalAnalise" class="analise-box"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Entry point Vite (em dev e no build) -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
