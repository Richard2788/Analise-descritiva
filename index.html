<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos de Cotas por Curso</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js (UMD global) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #3b82f6;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding-bottom: 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-top: 1rem;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .course-section {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .course-header h2 {
            font-size: 1.25rem;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            background: #fafbfc;
            border-radius: 8px;
            padding: 0.5rem;
            border: 1px solid var(--border);
            transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .chart-wrapper.chart-clickable {
            cursor: pointer;
        }

        .chart-wrapper.chart-clickable:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.18);
            transform: translateY(-2px);
        }

        .chart-wrapper.chart-clickable:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (min-width: 992px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 1400px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
        }

        #modalChartContainer {
            position: relative;
            height: 420px;
            width: 100%;
        }

        #metricSelector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        #metricSelector .btn.active {
            background-color: var(--bs-primary);
            color: #fff;
            border-color: var(--bs-primary);
        }

        .analise-box {
            background: #f8f9fa;
            border-left: 4px solid var(--bs-primary);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .modal-xl {
            --bs-modal-width: 92vw;
            max-width: 1100px;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid px-3 px-md-4">
        <header class="page-header">
            <h1>Análise de Cotas por Curso</h1>
            <p class="text-muted mb-0">Evolução anual de notas mínimas, concorrência, candidatos e vagas</p>
        </header>

        <main id="charts-root"></main>

        <footer>
            Dados processados de database.js · Gráficos gerados com Chart.js · UI com Bootstrap 5
        </footer>
    </div>

    <!-- Modal reutilizável -->
    <div class="modal fade" id="chartModal" tabindex="-1" aria-labelledby="chartModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="chartModalLabel">Curso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <p class="text-muted small mb-2 text-center">Selecione o tipo de gráfico:</p>
                        <div id="metricSelector" role="group" aria-label="Tipos de gráfico">
                            <!-- botões via JS -->
                        </div>
                    </div>

                    <div id="modalChartContainer" class="mb-4 border rounded p-2 bg-white">
                        <canvas id="modalChartCanvas"></canvas>
                    </div>

                    <div>
                        <h6 class="fw-semibold mb-2">Análise do curso</h6>
                        <div id="modalAnalise" class="analise-box"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Entry point Vite (em dev e no build) -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
